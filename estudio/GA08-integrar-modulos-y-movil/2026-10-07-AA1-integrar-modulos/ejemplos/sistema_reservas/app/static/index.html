<!doctype html>
<!--
  Frontend del sistema integrado: login y panel de hoteles (lo que la instructora armó en HTML + JavaScript).
  Habla con la API del mismo servidor usando fetch() con rutas relativas (/api/...).
-->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reservas HyD</title>
    <style>
      :root { --azul: #1f3a5f; --borde: #d5dbe5; }
      body { font-family: system-ui, sans-serif; background: #f4f6fa; margin: 0; color: #1c2430; }
      main { max-width: 820px; margin: 0 auto; padding: 24px 16px; }
      h1 { color: var(--azul); font-size: 1.5rem; margin: 0 0 16px; }
      .tarjeta { background: white; border: 1px solid var(--borde); border-radius: 12px; padding: 18px; margin-bottom: 16px; }
      .fila { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
      label { display: flex; flex-direction: column; gap: 4px; font-size: 0.85rem; }
      input { padding: 8px; border: 1px solid var(--borde); border-radius: 8px; font-size: 0.95rem; }
      button { background: var(--azul); color: white; border: none; border-radius: 20px; padding: 8px 18px; cursor: pointer; }
      button.sec { background: white; color: var(--azul); border: 1px solid var(--azul); padding: 4px 12px; }
      table { width: 100%; border-collapse: collapse; }
      th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--borde); }
      .ok { color: #2e7d32; } .error { color: #c62828; }
      .oculto { display: none; }
      header { display: flex; justify-content: space-between; align-items: center; }
    </style>
  </head>
  <body>
    <main>
      <!-- Pantalla 1: inicio de sesión -->
      <section id="pantalla-login" class="tarjeta" style="max-width: 320px; margin: 60px auto">
        <h1>Reservas HyD</h1>
        <form id="form-login">
          <label>Usuario <input id="usuario" required /></label><br />
          <label>Contraseña <input id="contrasena" type="password" required /></label><br />
          <button type="submit">Ingresar</button>
        </form>
        <p id="msg-login"></p>
      </section>

      <!-- Pantalla 2: panel de hoteles (CRUD) -->
      <section id="pantalla-panel" class="oculto">
        <header>
          <h1>Hoteles</h1>
          <span><span id="quien"></span> <button class="sec" id="salir">Cerrar sesión</button></span>
        </header>
        <form id="form-hotel" class="tarjeta fila">
          <input type="hidden" id="hotel-id" />
          <label>Nombre <input id="nombre" required /></label>
          <label>Ciudad <input id="ciudad" required /></label>
          <label>Estrellas <input id="estrellas" type="number" min="1" max="5" required style="width: 70px" /></label>
          <label>Tarifa noche <input id="tarifa" type="number" min="1" required style="width: 120px" /></label>
          <button type="submit" id="btn-guardar">Guardar</button>
          <button type="button" class="sec" id="btn-limpiar">Limpiar</button>
        </form>
        <p id="msg-panel"></p>
        <table class="tarjeta">
          <thead><tr><th>Nombre</th><th>Ciudad</th><th>★</th><th>Tarifa</th><th></th></tr></thead>
          <tbody id="filas"></tbody>
        </table>
      </section>
    </main>

    <script>
      const $ = (id) => document.getElementById(id)

      function mostrar(id, texto, error = false) {
        $(id).textContent = texto
        $(id).className = error ? 'error' : 'ok'
      }

      // ---- Login: POST /api/auth/login ----
      $('form-login').addEventListener('submit', async (e) => {
        e.preventDefault()
        const r = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ usuario: $('usuario').value, contrasena: $('contrasena').value }),
        })
        const cuerpo = await r.json()
        if (!r.ok) return mostrar('msg-login', cuerpo.detail, true)
        $('quien').textContent = `${cuerpo.usuario} (${cuerpo.rol})`
        $('pantalla-login').classList.add('oculto')
        $('pantalla-panel').classList.remove('oculto')
        cargarHoteles()
      })

      $('salir').addEventListener('click', () => location.reload())

      // ---- Listar: GET /api/hoteles ----
      async function cargarHoteles() {
        const hoteles = await (await fetch('/api/hoteles')).json()
        $('filas').innerHTML = ''
        for (const h of hoteles) {
          const fila = document.createElement('tr')
          fila.innerHTML = `<td>${h.nombre}</td><td>${h.ciudad}</td><td>${h.estrellas}</td>
            <td>$${h.tarifa_noche.toLocaleString('es-CO')}</td>
            <td><button class="sec">Editar</button> <button class="sec">Eliminar</button></td>`
          const [editar, eliminar] = fila.querySelectorAll('button')
          editar.onclick = () => cargarEnFormulario(h)
          eliminar.onclick = () => eliminarHotel(h.id)
          $('filas').appendChild(fila)
        }
      }

      function cargarEnFormulario(h) {
        $('hotel-id').value = h.id
        $('nombre').value = h.nombre
        $('ciudad').value = h.ciudad
        $('estrellas').value = h.estrellas
        $('tarifa').value = h.tarifa_noche
        $('btn-guardar').textContent = 'Actualizar'
      }

      function limpiar() {
        $('form-hotel').reset()
        $('hotel-id').value = ''
        $('btn-guardar').textContent = 'Guardar'
      }
      $('btn-limpiar').addEventListener('click', limpiar)

      // ---- Crear (POST) o actualizar (PUT) según haya id ----
      $('form-hotel').addEventListener('submit', async (e) => {
        e.preventDefault()
        const id = $('hotel-id').value
        const datos = {
          nombre: $('nombre').value,
          ciudad: $('ciudad').value,
          estrellas: Number($('estrellas').value),
          tarifa_noche: Number($('tarifa').value),
        }
        const r = await fetch(id ? `/api/hoteles/${id}` : '/api/hoteles', {
          method: id ? 'PUT' : 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(datos),
        })
        if (!r.ok) return mostrar('msg-panel', 'Revisa los datos del hotel', true)
        mostrar('msg-panel', id ? 'Hotel actualizado' : 'Hotel creado')
        limpiar()
        cargarHoteles()
      })

      // ---- Eliminar: DELETE /api/hoteles/{id} ----
      async function eliminarHotel(id) {
        if (!confirm('¿Eliminar este hotel?')) return
        await fetch(`/api/hoteles/${id}`, { method: 'DELETE' })
        mostrar('msg-panel', 'Hotel eliminado')
        cargarHoteles()
      }
    </script>
  </body>
</html>
